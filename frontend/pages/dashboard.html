<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClubSphere | Dashboard</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="app-page">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark small">CS</span><div><strong>ClubSphere</strong><small>Campus Clubs</small></div></div>
      <nav id="nav"></nav>
      <div class="sidebar-bottom"><div class="user-mini"><div class="avatar" id="avatar">U</div><div><strong id="sideName">User</strong><small id="sideRole">Role</small></div></div><button class="logout-link" id="logoutBtn">Log out</button></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button class="mobile-menu" id="mobileMenu">☰</button><div><p class="eyebrow" id="pageEyebrow">DASHBOARD</p><h1 id="pageTitle">Overview</h1></div><div class="top-actions"><button class="icon-btn" id="refreshBtn" title="Refresh">↻</button><button class="notification-btn" id="notificationBtn">🔔 <span id="notifCount" class="badge hidden">0</span></button></div></header>
      <div id="toast" class="toast"></div>
      <section id="view"></section>
    </main>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
